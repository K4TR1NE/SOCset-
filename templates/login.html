<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0%' stop-color='%239d7be8'/><stop offset='100%' stop-color='%23c77dff'/></linearGradient></defs><text x='10' y='85' font-size='80' font-weight='900' font-family='Arial' fill='url(%23g)'>V</text><text x='55' y='40' font-size='30' fill='%23ffd93d'>✦</text></svg>">
    <meta name="theme-color" content="#9d7be8">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEGA - Вход</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #1e1730 0%, #2a1f3a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Декоративные элементы */
        .bg-decoration {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .bg-decoration-1 {
            top: -150px;
            right: -150px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(157, 123, 232, 0.15) 0%, transparent 70%);
            animation: float 8s ease-in-out infinite;
        }

        .bg-decoration-2 {
            bottom: -100px;
            left: -100px;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(199, 125, 255, 0.1) 0%, transparent 70%);
            animation: float 6s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        /* Звезды */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }

        .star:nth-child(1) { top: 10%; left: 15%; width: 2px; height: 2px; animation-delay: 0s; }
        .star:nth-child(2) { top: 20%; right: 20%; width: 3px; height: 3px; animation-delay: 0.5s; }
        .star:nth-child(3) { top: 60%; left: 10%; width: 2px; height: 2px; animation-delay: 1s; }
        .star:nth-child(4) { bottom: 30%; right: 15%; width: 2px; height: 2px; animation-delay: 1.5s; }
        .star:nth-child(5) { top: 40%; left: 25%; width: 3px; height: 3px; animation-delay: 2s; }
        .star:nth-child(6) { bottom: 20%; left: 30%; width: 2px; height: 2px; animation-delay: 0.8s; }
        .star:nth-child(7) { top: 15%; right: 30%; width: 2px; height: 2px; animation-delay: 1.2s; }
        .star:nth-child(8) { bottom: 40%; right: 25%; width: 3px; height: 3px; animation-delay: 1.8s; }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Контейнер */
        .auth-container {
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 1;
        }

        /* Карточка */
        .auth-card {
            background: rgba(37, 28, 51, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 45px 40px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(63, 49, 83, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            border: 1px solid #3f3153;
            width: 100%;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Логотип */
        .auth-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-logo-bars {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            margin-bottom: 10px;
        }

        .auth-logo-star {
            font-size: 18px;
            background: linear-gradient(135deg, #c77dff, #b8a2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: starPulse 2s ease-in-out infinite;
        }

        .auth-logo-v {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #f0e9ff, #9d7be8, #c77dff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }

        .auth-logo-e-bars {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin: 0 4px;
            justify-content: center;
            height: 48px;
        }

        .auth-logo-e-bar {
            display: block;
            width: 26px;
            height: 5px;
            background: linear-gradient(90deg, #9d7be8, #c77dff);
            border-radius: 3px;
        }

        .auth-logo-g {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #f0e9ff, #c77dff, #b8a2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }

        .auth-logo-lambda {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #c77dff, #b8a2ff, #9d7be8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }

        @keyframes starPulse {
            0%, 100% { opacity: 0.5; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        .auth-subtitle {
            text-align: center;
            color: #a08bb4;
            margin-bottom: 35px;
            font-size: 15px;
            line-height: 1.5;
        }

        /* Поля ввода */
        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            color: #f0e9ff;
            margin-bottom: 10px;
            font-weight: 500;
            font-size: 14px;
            letter-spacing: 0.3px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i.input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b5b8a;
            font-size: 16px;
            transition: all 0.3s;
            z-index: 1;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px 14px 45px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid #3f3153;
            border-radius: 14px;
            color: #f0e9ff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }

        .form-group input:focus {
            border-color: #9d7be8;
            box-shadow: 0 0 20px rgba(157, 123, 232, 0.2), 0 0 0 3px rgba(157, 123, 232, 0.1);
            background: rgba(255, 255, 255, 0.07);
        }

        .form-group input::placeholder {
            color: #5a4d6e;
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b5b8a;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
            z-index: 1;
            padding: 5px;
        }

        .password-toggle:hover {
            color: #c77dff;
        }

        /* Чекбокс */
        .remember-me {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            color: #b8a8cc;
            font-size: 14px;
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            display: none;
        }

        .custom-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid #3f3153;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            cursor: pointer;
            flex-shrink: 0;
        }

        .custom-checkbox i {
            color: white;
            font-size: 11px;
            opacity: 0;
            transition: all 0.3s;
        }

        .remember-me input:checked + .custom-checkbox {
            background: linear-gradient(135deg, #9d7be8, #c77dff);
            border-color: transparent;
        }

        .remember-me input:checked + .custom-checkbox i {
            opacity: 1;
        }

        /* Кнопка */
        .btn-auth {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #9d7be8 0%, #c77dff 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .btn-auth::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn-auth:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-auth:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(157, 123, 232, 0.5);
        }

        .btn-auth:active {
            transform: translateY(0);
            box-shadow: 0 5px 15px rgba(157, 123, 232, 0.3);
        }

        .btn-auth span, .btn-auth i {
            position: relative;
            z-index: 1;
        }

        /* Футер */
        .auth-footer {
            text-align: center;
            margin-top: 25px;
            color: #b8a8cc;
            font-size: 14px;
        }

        .auth-footer a {
            color: #c77dff;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            position: relative;
        }

        .auth-footer a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(135deg, #9d7be8, #c77dff);
            transition: width 0.3s;
        }

        .auth-footer a:hover::after {
            width: 100%;
        }

        /* Алерты */
        .alert {
            padding: 14px 18px;
            border-radius: 14px;
            margin-bottom: 25px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideDown 0.4s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-error {
            background: rgba(255, 107, 139, 0.12);
            border: 1px solid rgba(255, 107, 139, 0.3);
            color: #ff6b8b;
        }

        .alert-success {
            background: rgba(138, 158, 255, 0.12);
            border: 1px solid rgba(138, 158, 255, 0.3);
            color: #8a9eff;
        }

        .alert-info {
            background: rgba(157, 123, 232, 0.12);
            border: 1px solid rgba(157, 123, 232, 0.3);
            color: #c77dff;
        }

        .alert i {
            font-size: 20px;
            flex-shrink: 0;
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
                align-items: flex-start;
                padding-top: 40px;
            }

            .auth-card {
                padding: 30px 22px;
                border-radius: 20px;
            }

            .auth-logo-v, .auth-logo-g, .auth-logo-lambda {
                font-size: 38px;
            }

            .auth-logo-e-bars {
                height: 38px;
                gap: 5px;
            }

            .auth-logo-e-bar {
                width: 22px;
                height: 4px;
            }

            .auth-logo-star {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- Декоративные элементы -->
    <div class="bg-decoration bg-decoration-1"></div>
    <div class="bg-decoration bg-decoration-2"></div>

    <!-- Звезды -->
    <div class="stars">
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <!-- Логотип -->
            <div class="auth-logo">
                <div class="auth-logo-bars">
                    <span class="auth-logo-star">✦</span>
                    <span class="auth-logo-v">V</span>
                    <span class="auth-logo-e-bars">
                        <span class="auth-logo-e-bar"></span>
                        <span class="auth-logo-e-bar"></span>
                        <span class="auth-logo-e-bar"></span>
                    </span>
                    <span class="auth-logo-g">G</span>
                    <span class="auth-logo-lambda">Λ</span>
                    <span class="auth-logo-star">✦</span>
                </div>
            </div>
            <div class="auth-subtitle">Войдите в астрологическую<br>социальную сеть</div>

            <!-- Сообщения -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">
                            <i class="fas fa-{% if category == 'error' %}exclamation-circle{% elif category == 'success' %}check-circle{% else %}info-circle{% endif %}"></i>
                            <span>{{ message }}</span>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <!-- Форма -->
            <form method="POST" action="{{ url_for('login') }}" autocomplete="off">
                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="example@mail.ru"
                            required
                            autofocus
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Введите пароль"
                            required
                        >
                        <i class="fas fa-eye password-toggle" onclick="togglePassword()" title="Показать пароль"></i>
                    </div>
                </div>

                <label class="remember-me" for="remember">
                    <input type="checkbox" id="remember" name="remember">
                    <span class="custom-checkbox">
                        <i class="fas fa-check"></i>
                    </span>
                    Запомнить меня
                </label>

                <button type="submit" class="btn-auth">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>Войти</span>
                </button>
            </form>

            <div class="auth-footer">
                Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.querySelector('.password-toggle');

            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
                icon.style.color = '#c77dff';
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
                icon.style.color = '#6b5b8a';
            }
        }

        // Автоскрытие алертов
        setTimeout(() => {
            const alerts = document.querySelectorAll('.alert');
            alerts.forEach(alert => {
                alert.style.transition = 'all 0.5s';
                alert.style.opacity = '0';
                alert.style.transform = 'translateY(-10px)';
                setTimeout(() => alert.remove(), 500);
            });
        }, 5000);
    </script>
</body>
</html>
